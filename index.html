<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이크로비트 광센서 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .gauge-container {
            width: 200px; height: 100px; overflow: hidden; position: relative; margin: 0 auto;
        }
        .gauge-background {
            width: 200px; height: 200px; background-color: #e5e7eb; border-radius: 50%; position: absolute;
        }
        .gauge-fill {
            width: 200px; height: 200px; background-color: #facc15; border-radius: 50%; position: absolute;
            transform: rotate(0deg); transform-origin: center; transition: transform 0.3s ease-out;
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
        }
        .gauge-cover {
            width: 160px; height: 160px; background-color: white; border-radius: 50%; position: absolute;
            top: 20px; left: 20px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 space-y-6">
        
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-800">☀️ 실시간 빛 센서</h1>
            <p class="text-sm text-gray-500 mt-1">마이크로비트 블루투스 연결</p>
        </div>

        <!-- 상태 및 연결 버튼 -->
        <div class="flex flex-col items-center gap-3">
            <span id="statusText" class="px-3 py-1 bg-red-100 text-red-600 rounded-full text-sm font-semibold">연결 안 됨</span>
            <button id="connectBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition-colors flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 2a.75.75 0 01.75.75v5.59l1.95-2.1a.75.75 0 111.1 1.02l-3.25 3.5a.75.75 0 01-1.1 0L6.2 7.26a.75.75 0 111.1-1.02l1.95 2.1V2.75A.75.75 0 0110 2zM5.27 10.27a.75.75 0 011.02-.11 4.5 4.5 0 005.42 0 .75.75 0 11.88 1.18 6 6 0 01-7.2 0 .75.75 0 01-.12-1.07z" clip-rule="evenodd" />
                </svg>
                블루투스 연결하기
            </button>
        </div>

        <!-- 측정 제어 버튼 -->
        <div class="flex gap-2 w-full">
            <button id="btnStart" disabled class="flex-1 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">▶ 시작</button>
            <button id="btnStop" disabled class="flex-1 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">■ 정지</button>
            <button id="btnReset" disabled class="flex-1 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">↺ 리셋</button>
        </div>

        <!-- 센서 값 표시 영역 -->
        <div class="bg-gray-50 p-6 rounded-xl border border-gray-100 text-center relative">
            <div id="measuringIndicator" class="absolute top-4 right-4 flex items-center gap-2 hidden">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-xs font-bold text-green-600">측정 중</span>
            </div>
            
            <div class="text-gray-600 text-sm font-semibold mb-4">현재 밝기 (0~1023)</div>
            
            <div class="gauge-container mb-2">
                <div class="gauge-background"></div>
                <div class="gauge-fill" id="gaugeFill" style="transform: rotate(-180deg);"></div>
                <div class="gauge-cover"></div>
            </div>
            
            <div class="text-5xl font-black text-gray-800" id="lightValueDisplay">0</div>
        </div>

        <!-- 구글 시트 연동 영역 -->
        <div class="border-t border-gray-200 pt-6 space-y-4">
            <h2 class="text-lg font-semibold text-gray-800">📊 구글 시트로 데이터 보내기</h2>
            
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">구글 Apps Script 웹 앱 URL</label>
                <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/..." class="w-full text-sm p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <div class="flex items-center justify-between bg-blue-50 p-4 rounded-lg border border-blue-100">
                <div class="text-sm font-semibold text-blue-800">시트로 실시간 전송</div>
                <!-- 토글 스위치 -->
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" id="sendToggle" class="sr-only peer">
                  <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>
            <p class="text-xs text-gray-400 text-center">토글을 켜면 센서 값이 바뀔 때마다 시트에 기록됩니다.</p>
        </div>

    </div>

    <script>
        // 마이크로비트 UART 블루투스 고유 주소(UUID)
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RECEIVE_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // 앱이 받는 곳(마이크로비트 TX)
        const UART_SEND_UUID    = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 앱이 보내는 곳(마이크로비트 RX)

        let bluetoothDevice;
        let receiveCharacteristic;
        let sendCharacteristic;
        let isSendingToGas = false;
        let lastSentTime = 0;

        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const lightValueDisplay = document.getElementById('lightValueDisplay');
        const gaugeFill = document.getElementById('gaugeFill');
        const gasUrlInput = document.getElementById('gasUrl');
        const sendToggle = document.getElementById('sendToggle');
        
        // 제어 버튼들
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnReset = document.getElementById('btnReset');
        const measuringIndicator = document.getElementById('measuringIndicator');

        // 로컬 스토리지에 저장된 URL 불러오기
        if (localStorage.getItem('gasUrl')) {
            gasUrlInput.value = localStorage.getItem('gasUrl');
        }

        // 토글 버튼 이벤트
        sendToggle.addEventListener('change', (e) => {
            isSendingToGas = e.target.checked;
            if (isSendingToGas && gasUrlInput.value.trim() === '') {
                alert('구글 Apps Script URL을 먼저 입력해주세요!');
                e.target.checked = false;
                isSendingToGas = false;
            }
        });

        // URL 입력 시 로컬 스토리지에 자동 저장
        gasUrlInput.addEventListener('input', (e) => {
            localStorage.setItem('gasUrl', e.target.value);
        });

        // 블루투스 연결 함수
        connectBtn.addEventListener('click', async () => {
            try {
                if (!navigator.bluetooth) {
                    alert('이 브라우저는 웹 블루투스를 지원하지 않습니다. PC나 안드로이드 크롬을 사용해주세요.');
                    return;
                }

                statusText.textContent = "검색 중...";
                statusText.className = "px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-sm font-semibold";

                // 기기 검색 및 연결
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                
                receiveCharacteristic = await service.getCharacteristic(UART_RECEIVE_UUID);
                sendCharacteristic = await service.getCharacteristic(UART_SEND_UUID);
                
                await receiveCharacteristic.startNotifications();
                receiveCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

                statusText.textContent = "연결됨";
                statusText.className = "px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-semibold";
                connectBtn.textContent = "연결 끊기";
                connectBtn.classList.replace('bg-blue-600', 'bg-red-600');
                connectBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');
                
                // 제어 버튼 활성화
                btnStart.disabled = false;
                btnStop.disabled = false;
                btnReset.disabled = false;
                
            } catch (error) {
                console.error(error);
                statusText.textContent = "연결 실패";
                statusText.className = "px-3 py-1 bg-red-100 text-red-600 rounded-full text-sm font-semibold";
            }
        });

        // 블루투스 끊어졌을 때
        function onDisconnected() {
            statusText.textContent = "연결 끊어짐";
            statusText.className = "px-3 py-1 bg-red-100 text-red-600 rounded-full text-sm font-semibold";
            connectBtn.textContent = "블루투스 연결하기";
            connectBtn.classList.replace('bg-red-600', 'bg-blue-600');
            connectBtn.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
            
            // 제어 버튼 비활성화
            btnStart.disabled = true;
            btnStop.disabled = true;
            btnReset.disabled = true;
            setMeasuringUI(false);
            
            resetDashboard();
        }

        // 마이크로비트로 명령어 보내기
        async function sendCommand(cmd) {
            if (!sendCharacteristic) return;
            try {
                let encoder = new TextEncoder('utf-8');
                // 마이크로비트가 줄바꿈 단위로 읽도록 \n 추가
                await sendCharacteristic.writeValue(encoder.encode(cmd + '\n'));
            } catch (error) {
                console.error('명령어 전송 실패:', error);
            }
        }

        // 버튼 클릭 이벤트
        btnStart.addEventListener('click', () => { sendCommand('START'); setMeasuringUI(true); });
        btnStop.addEventListener('click', () => { sendCommand('STOP'); setMeasuringUI(false); });
        btnReset.addEventListener('click', () => { sendCommand('RESET'); setMeasuringUI(false); resetDashboard(); });

        function setMeasuringUI(isMeasuring) {
            if (isMeasuring) {
                measuringIndicator.classList.remove('hidden');
            } else {
                measuringIndicator.classList.add('hidden');
            }
        }

        function resetDashboard() {
            lightValueDisplay.textContent = "0";
            gaugeFill.style.transform = `rotate(-180deg)`;
        }

        // 데이터가 들어왔을 때 처리 (마이크로비트에서 값이 올 때마다 실행)
        let dataBuffer = '';
        function handleNotifications(event) {
            let value = event.target.value;
            let decoder = new TextDecoder('utf-8');
            let text = decoder.decode(value);
            
            dataBuffer += text;
            let parts = dataBuffer.split('\n');
            
            // 마지막 요소는 아직 줄바꿈으로 끝나지 않은 불완전한 데이터
            while (parts.length > 1) {
                let completeData = parts.shift().trim();
                
                if (completeData !== "") {
                    // 마이크로비트에서 보낸 명령어 처리
                    if (completeData === "CMD:START") {
                        setMeasuringUI(true);
                    } else if (completeData === "CMD:STOP") {
                        setMeasuringUI(false);
                    } else if (completeData === "CMD:RESET") {
                        setMeasuringUI(false);
                        resetDashboard();
                    } else {
                        // 일반 숫자 센서 값인 경우
                        updateDashboard(parseInt(completeData));
                    }
                }
            }
            dataBuffer = parts[0]; // 불완전한 데이터는 버퍼에 남김
        }

        // 대시보드 화면 업데이트 및 구글 시트 전송
        function updateDashboard(lightValue) {
            if(isNaN(lightValue)) return;

            // 1. 화면 UI 업데이트 (값 및 게이지 바)
            lightValueDisplay.textContent = lightValue;
            
            // 0~1023 값을 0~180도 각도로 변환 (-180deg ~ 0deg)
            let degree = (lightValue / 1023) * 180 - 180;
            gaugeFill.style.transform = `rotate(${degree}deg)`;

            // 2. 구글 시트로 데이터 전송 (토글이 켜져있고, URL이 있을 때)
            if (isSendingToGas && gasUrlInput.value.trim() !== '') {
                // 스팸 방지: 구글 시트로 보내는건 최소 1.5초 간격 유지 (마이크로비트 코드에서도 1.5초 대기하긴 함)
                let now = Date.now();
                if (now - lastSentTime > 1500) {
                    sendToGoogleSheets(lightValue);
                    lastSentTime = now;
                }
            }
        }

        // 구글 Apps Script로 HTTP POST 요청 보내기
        function sendToGoogleSheets(value) {
            const url = gasUrlInput.value.trim();
            const formData = new URLSearchParams();
            formData.append('lightValue', value);

            fetch(url, {
                method: 'POST',
                body: formData,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                }
            })
            .then(response => response.text())
            .then(result => console.log('시트 저장 성공:', result))
            .catch(error => console.error('시트 저장 에러:', error));
        }
    </script>
</body>
</html>
